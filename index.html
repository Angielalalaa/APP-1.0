<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>我的工作生活管理</title>
<style>
/* ═══ RESET ═══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}

/* ═══ DESIGN TOKENS ════════════════════════════════════ */
:root{
  /* Neutrals */
  --bg:#F4F6FC;--bg-card:#FFFFFF;--bg-sub:#ECEEF8;
  --text:#141929;--text-2:#5B6480;--text-3:#9AA3C0;
  --border:#E3E8F5;--border-in:#CDD5EC;
  /* Elevation */
  --shd:0 1px 3px rgba(20,25,46,.06),0 1px 2px rgba(20,25,46,.04);
  --shd-md:0 4px 18px rgba(20,25,46,.09),0 2px 6px rgba(20,25,46,.05);
  --shd-lg:0 8px 30px rgba(20,25,46,.12),0 4px 10px rgba(20,25,46,.06);
  /* Layout */
  --r:13px;--r-sm:9px;--nw:234px;--tr:.17s ease;
  /* ── Purple Accent (default) ── */
  --a:#7C3AED;--a-d:#6D28D9;--a-l:#F0EAFF;--a-ll:#EDE9FE;--a-rgb:124,58,237;
  /* Sidebar */
  --sb:#120E22;--sb-t:rgba(196,181,253,.68);--sb-th:rgba(221,214,254,.96);
  --sb-act-bg:rgba(124,58,237,.16);--sb-act-t:#DDD6FE;--sb-act-b:#7C3AED;
  --sb-sep:rgba(255,255,255,.07);--sb-logo:#EDE9FE;
  /* Legacy / semantic */
  --red:#EF4444;--amber:#F59E0B;--orange:#F97316;--green:#10B981;--blue:#3B82F6;--purple:#8B5CF6;
}
/* ── Green Theme ── */
body[data-color="green"]{
  --a:#059669;--a-d:#047857;--a-l:#ECFDF5;--a-ll:#D1FAE5;--a-rgb:5,150,105;
  --sb:#071F15;--sb-t:rgba(110,231,183,.68);--sb-th:rgba(167,243,208,.96);
  --sb-act-bg:rgba(5,150,105,.16);--sb-act-t:#A7F3D0;--sb-act-b:#059669;--sb-logo:#D1FAE5;
}
/* ── Pink Theme ── */
body[data-color="pink"]{
  --a:#DB2777;--a-d:#BE185D;--a-l:#FFF0F8;--a-ll:#FCE7F3;--a-rgb:219,39,119;
  --sb:#1E0917;--sb-t:rgba(251,207,232,.68);--sb-th:rgba(253,228,243,.96);
  --sb-act-bg:rgba(219,39,119,.16);--sb-act-t:#FBCFE8;--sb-act-b:#DB2777;--sb-logo:#FCE7F3;
}
/* ── Dark Mode ── */
[data-theme="dark"]{
  --bg:#0D0F1E;--bg-card:#181B2F;--bg-sub:#13162A;
  --text:#EDF0FA;--text-2:#8891B0;--text-3:#4D5578;
  --border:#272B44;--border-in:#363B5A;
  --shd:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
  --shd-md:0 4px 18px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.3);
}

/* ═══ BASE ═══════════════════════════════════════════ */
body{display:flex;min-height:100vh;background:var(--bg);color:var(--text);transition:background var(--tr),color var(--tr)}

/* ═══ SIDEBAR ══════════════════════════════════════════ */
.sidebar{width:var(--nw);background:var(--sb);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;padding-top:env(safe-area-inset-top)}
.sb-head{padding:22px 16px 18px;border-bottom:1px solid var(--sb-sep)}
.sb-logo{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.sb-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--a),var(--a-d));display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;box-shadow:0 3px 10px rgba(var(--a-rgb),.45);flex-shrink:0}
.sb-name{color:var(--sb-logo);font-size:14px;font-weight:700;letter-spacing:.01em}
.sb-sub{color:var(--sb-t);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding-left:40px}
.nav-list{list-style:none;padding:10px 10px;flex:1}
.nav-item a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;text-decoration:none;color:var(--sb-t);font-size:13px;font-weight:500;transition:all var(--tr);cursor:pointer;border-left:2.5px solid transparent;margin-bottom:1px}
.nav-item a:hover{background:rgba(255,255,255,.07);color:var(--sb-th)}
.nav-item a.active{background:var(--sb-act-bg);color:var(--sb-act-t);border-left-color:var(--sb-act-b);font-weight:600}
.nav-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.sb-foot{padding:12px 16px;border-top:1px solid var(--sb-sep);color:var(--sb-t);font-size:10.5px;opacity:.65}

/* ═══ MAIN LAYOUT ══════════════════════════════════════ */
.main{margin-left:var(--nw);flex:1;padding:32px 38px;min-height:100vh;overflow-y:auto}
.page{display:none}
.page.active{display:block}

/* ── Page Header ── */
.ph{margin-bottom:28px}
.ph-row{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.ph-bar{width:3px;height:20px;background:linear-gradient(180deg,var(--a),var(--a-d));border-radius:2px;flex-shrink:0}
.ph-title{font-size:20px;font-weight:800;letter-spacing:-.015em;color:var(--text)}
.ph-sub{font-size:13px;color:var(--text-3);margin-top:2px;padding-left:12px}

/* ═══ CARDS ══════════════════════════════════════════ */
.card{background:var(--bg-card);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shd);border:1px solid var(--border);transition:box-shadow var(--tr),border-color var(--tr)}
.card:hover{box-shadow:var(--shd-md)}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ct{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;color:var(--text)}
.cdot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}

/* ── Grid ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.span2{grid-column:span 2}

/* ═══ BUTTONS ═════════════════════════════════════════ */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 15px;border-radius:var(--r-sm);border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all var(--tr);font-family:inherit;line-height:1.3;letter-spacing:.01em}
.btn-p{background:linear-gradient(135deg,var(--a) 0%,var(--a-d) 100%);color:#fff;box-shadow:0 2px 8px rgba(var(--a-rgb),.32)}
.btn-p:hover{box-shadow:0 4px 14px rgba(var(--a-rgb),.45);filter:brightness(1.06);transform:translateY(-1px)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-g{background:transparent;color:var(--text-2);border:1px solid var(--border)}.btn-g:hover{background:var(--bg-sub);color:var(--text)}
.btn-d{background:#FEE2E2;color:var(--red);border:none}.btn-d:hover{background:#FECACA}
.bti{width:29px;height:29px;padding:0;border-radius:7px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:transparent;color:var(--text-3);cursor:pointer;font-size:12px;transition:all var(--tr)}
.bti:hover{background:var(--bg-sub);color:var(--text);border-color:var(--border-in)}
.bti.del:hover{background:#FEE2E2;color:var(--red);border-color:#FECACA}
.bti:disabled{opacity:.3;cursor:not-allowed}

/* ═══ INPUTS ══════════════════════════════════════════ */
.inp,.ta,select.inp{width:100%;padding:7px 11px;border:1px solid var(--border-in);border-radius:var(--r-sm);font-size:13px;font-family:inherit;color:var(--text);background:var(--bg-card);outline:none;transition:border-color var(--tr),box-shadow var(--tr)}
.inp:focus,.ta:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(var(--a-rgb),.12)}
.ta{resize:vertical;min-height:80px;line-height:1.6}
.ig{display:flex;gap:8px;align-items:center}
.fl{display:block;font-size:10.5px;font-weight:700;color:var(--text-3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.fg{margin-bottom:12px}

/* ── Progress ── */
.pbar{height:6px;background:var(--bg-sub);border-radius:4px;overflow:hidden;margin:8px 0}
.pfill{height:100%;border-radius:4px;transition:width .4s ease;background:linear-gradient(90deg,var(--a),var(--a-d))}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.b-hi{background:#FEE8E8;color:#C92A2A}
.b-md{background:#FFF4E0;color:#B45309}
.b-lo{background:#E5F6EE;color:#1F7A4D}
.b-am{background:#EBF2FF;color:#2563EB}
.b-pm{background:#FFF0F7;color:#C2185B}
.b-ev{background:var(--a-ll);color:var(--a-d)}

/* ── Check items ── */
.ci{display:flex;align-items:flex-start;gap:9px;padding:7px 0}
.ci input[type=checkbox]{width:16px;height:16px;min-width:16px;cursor:pointer;accent-color:var(--a);margin-top:2px}
.ci label{cursor:pointer;font-size:13.5px;color:var(--text);line-height:1.5;flex:1}
.ci.done label{text-decoration:line-through;color:var(--text-3)}

/* ═══ HOME ════════════════════════════════════════════ */
.hg{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.hd{font-size:13px;color:var(--text-3);margin-bottom:26px;letter-spacing:.01em}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.memo-card{grid-row:span 2}
.sum-card{cursor:pointer;position:relative;overflow:hidden}
.sum-card:hover{border-color:rgba(var(--a-rgb),.35)}
.sum-n{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.03em}
.sum-d{font-size:13px;color:var(--text-3);margin-left:5px}
.ai-prev{font-size:13px;color:var(--text-2);line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ── Date nav ── */
.date-nav{display:flex;align-items:center;gap:9px}
.dlbl{font-size:13px;font-weight:700;min-width:115px;text-align:center;color:var(--text);letter-spacing:.02em}

/* ═══ WORK PLAN ════════════════════════════════════════ */
.t3-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.t3-item:last-child{border-bottom:none}
.t3-n{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--a),var(--a-d));color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.t3-in{flex:1;border:none;background:transparent;font-size:13.5px;color:var(--text);outline:none;font-family:inherit;font-weight:500}
.t3-in::placeholder{color:var(--text-3)}
.t3-in.done{text-decoration:line-through;color:var(--text-3)}
.task-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.task-row:last-child{border-bottom:none}
.task-txt{flex:1;font-size:13.5px;color:var(--text)}
.task-txt.done{text-decoration:line-through;color:var(--text-3)}
.add-form{display:grid;grid-template-columns:1fr auto auto auto;gap:7px;margin-top:11px;padding-top:11px;border-top:1px solid var(--border)}

/* ═══ LIFE PLAN ════════════════════════════════════════ */
.hb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.hb-card{display:flex;flex-direction:column;align-items:center;gap:7px;padding:16px 10px;border-radius:var(--r-sm);border:1.5px solid var(--border);cursor:pointer;transition:all var(--tr);background:var(--bg-card);text-align:center}
.hb-card:hover{border-color:var(--a);background:var(--a-l)}
.hb-card.on{background:var(--a-l);border-color:var(--a);box-shadow:0 2px 10px rgba(var(--a-rgb),.14)}
[data-theme="dark"] .hb-card.on{background:rgba(var(--a-rgb),.12);border-color:var(--a)}
.hb-icon{font-size:26px}
.hb-name{font-size:11.5px;color:var(--text-2);font-weight:600}
.mood-row{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0}
.mood-btn{font-size:24px;background:none;border:2px solid transparent;border-radius:9px;cursor:pointer;padding:6px 10px;transition:all var(--tr);line-height:1}
.mood-btn:hover{background:var(--bg-sub);transform:scale(1.1)}
.mood-btn.sel{border-color:var(--a);background:var(--a-l)}
.mood-btn:disabled{cursor:default}

/* ═══ AI LEARNING ══════════════════════════════════════ */
.ai-wrap{display:flex;gap:18px;min-height:500px}
.ai-side{width:210px;flex-shrink:0}
.ai-body{flex:1;min-width:0}
.topic-list{list-style:none}
.tpi{display:flex;align-items:center;padding:8px 11px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text-2);transition:all var(--tr);gap:7px}
.tpi:hover{background:var(--bg-sub);color:var(--text)}
.tpi.active{background:var(--a-l);color:var(--a);font-weight:700}
.tpn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpd{opacity:0;font-size:11px}
.tpi:hover .tpd{opacity:1}
.ai-tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:14px}
.ai-tab{padding:7px 18px;font-size:13.5px;font-weight:500;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all var(--tr)}
.ai-tab:hover{color:var(--text)}
.ai-tab.active{color:var(--a);border-bottom-color:var(--a)}
.note-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:7px;cursor:pointer;transition:all var(--tr);background:var(--bg-card)}
.note-item:hover{border-color:var(--a);box-shadow:0 2px 10px rgba(var(--a-rgb),.1)}
.ni-title{font-size:13.5px;font-weight:600;color:var(--text)}
.ni-prev{font-size:11.5px;color:var(--text-3);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.ni-date{font-size:11px;color:var(--text-3)}
.res-item{display:flex;align-items:flex-start;gap:11px;padding:13px;border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:7px;background:var(--bg-card)}
.res-ttl{font-size:13.5px;font-weight:600;color:var(--a);text-decoration:none}
.res-ttl:hover{text-decoration:underline}
.res-desc{font-size:12px;color:var(--text-3);margin-top:2px}
.res-tp{font-size:11px;color:var(--a);margin-top:4px;font-weight:600}

/* ═══ SETTINGS ════════════════════════════════════════ */
.stitle{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);margin-bottom:14px}
.hb-set-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.hb-set-row:last-child{border-bottom:none}
.toggle{position:relative;width:42px;height:23px;background:var(--border-in);border-radius:12px;cursor:pointer;transition:background var(--tr);flex-shrink:0}
.toggle.on{background:var(--a)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;background:#fff;border-radius:50%;transition:transform var(--tr);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{transform:translateX(19px)}
.dz{border:1px solid #FECACA;border-radius:var(--r);padding:16px;background:#FFF5F5}
[data-theme="dark"] .dz{border-color:#7F1D1D;background:rgba(127,29,29,.15)}
.dz-title{font-size:13.5px;font-weight:700;color:var(--red);margin-bottom:10px}
/* Color Scheme Swatches */
.color-swatches{display:flex;gap:12px;padding:4px 0;flex-wrap:wrap}
.csw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:all var(--tr);box-shadow:0 2px 8px rgba(0,0,0,.14);outline:none}
.csw:hover{transform:scale(1.12)}
.csw.active{border-color:var(--text-2);box-shadow:0 0 0 2px var(--bg-card),0 0 0 4px var(--text-2)}
.csw-purple{background:linear-gradient(135deg,#7C3AED,#6D28D9)}
.csw-green{background:linear-gradient(135deg,#059669,#047857)}
.csw-pink{background:linear-gradient(135deg,#DB2777,#BE185D)}
.cs-label{font-size:12px;color:var(--text-2);font-weight:500;margin-top:2px}

/* ═══ MODAL ══════════════════════════════════════════ */
.mo{position:fixed;inset:0;background:rgba(10,12,30,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.mb{background:var(--bg-card);border-radius:var(--r);padding:26px;width:100%;max-width:560px;max-height:82vh;overflow-y:auto;box-shadow:var(--shd-lg)}
.mb-lg{max-width:680px}
.mt{font-size:15px;font-weight:700;color:var(--text);margin-bottom:16px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* ═══ TOAST ══════════════════════════════════════════ */
#toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:var(--bg-card);padding:10px 16px;border-radius:var(--r-sm);font-size:13px;z-index:9999;opacity:0;transform:translateY(8px);transition:all .2s ease;pointer-events:none;box-shadow:var(--shd-md)}
#toast.show{opacity:1;transform:translateY(0)}

/* ═══ EMPTY STATE ════════════════════════════════════ */
.es{text-align:center;padding:38px 20px;color:var(--text-3)}
.es-i{font-size:32px;margin-bottom:8px}
.es-t{font-size:13px;line-height:1.5}

/* ═══ WEEK DONE ══════════════════════════════════════ */
.wdc-day{margin-bottom:18px}
.wdc-day:last-child{margin-bottom:0}
.wdc-date{font-size:10.5px;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.wdc-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13.5px;color:var(--text);border-bottom:1px dashed var(--border)}
.wdc-item:last-child{border-bottom:none}
.wdc-mark{font-size:12px;flex-shrink:0;width:18px;text-align:center}
.wdc-mark.star{color:var(--amber)}
.wdc-mark.chk{color:var(--a)}

/* ═══ MISC ══════════════════════════════════════════ */
.sep{height:1px;background:var(--border);margin:14px 0}
.ts{font-size:11.5px;color:var(--text-3)}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.fb{display:flex;align-items:center;justify-content:space-between}
.fc{display:flex;align-items:center;gap:8px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-in);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

/* ═══ MOBILE BOTTOM NAV ═════════════════════════════ */
.mob-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;
  background:var(--sb);border-top:1px solid var(--sb-sep);
  padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom));
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
  z-index:200;justify-content:space-around;align-items:flex-start;
}
.mn-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:5px 8px;border-radius:10px;cursor:pointer;
  color:var(--sb-t);transition:all var(--tr);text-decoration:none;
  min-width:52px;text-align:center;border:none;background:none;font-family:inherit;
}
.mn-item:hover,.mn-item:active{color:var(--sb-th)}
.mn-item.active{color:var(--sb-act-t);background:var(--sb-act-bg)}
.mn-icon{font-size:20px;line-height:1.1}
.mn-lbl{font-size:10px;font-weight:500;letter-spacing:.01em;line-height:1}

/* ═══ RESPONSIVE — TABLET ════════════════════════════ */
@media (max-width:900px){
  :root{--nw:200px}
  .main{padding:24px 24px}
}

/* ═══ RESPONSIVE — MOBILE ════════════════════════════ */
@media (max-width:680px){
  /* Layout */
  .sidebar{display:none}
  .mob-nav{display:flex}
  .main{margin-left:0;padding:calc(16px + env(safe-area-inset-top)) 14px calc(72px + env(safe-area-inset-bottom))}

  /* Grid → single column */
  .g2,.g3{grid-template-columns:1fr;gap:12px}
  .span2{grid-column:span 1}
  .home-grid{grid-template-columns:1fr;gap:12px}
  .memo-card{grid-row:span 1}

  /* Typography */
  .hg{font-size:19px}
  .ph{margin-bottom:18px}
  .ph-title{font-size:18px}
  .ph-sub{font-size:12px}

  /* Cards */
  .card{padding:15px 14px}
  .ch{margin-bottom:11px}

  /* Page header row — stack on narrow screens */
  .ph .fb{flex-wrap:wrap;gap:10px}
  .date-nav{width:100%;justify-content:space-between}
  .dlbl{min-width:0;flex:1;text-align:center}

  /* AI layout → vertical */
  .ai-wrap{flex-direction:column;gap:12px;min-height:unset}
  .ai-side{width:100%}
  .ai-side .card{padding:12px}
  .ai-tabs .ai-tab{padding:7px 12px;font-size:13px}

  /* Add-task form → 2-column grid */
  .add-form{grid-template-columns:1fr 1fr;row-gap:8px}
  .add-form>input{grid-column:span 2}
  .add-form>button{grid-column:span 2;justify-content:center}

  /* Habit grid */
  .hb-grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px}
  .hb-card{padding:13px 8px}

  /* Touch targets */
  .bti{width:34px;height:34px}
  .btn{padding:9px 13px}
  .btn-sm{padding:7px 11px}
  .mood-btn{font-size:26px;padding:6px 8px}

  /* Home stats */
  .sum-n{font-size:28px}
  .fc{flex-wrap:wrap;gap:4px}

  /* Work plan */
  .t3-item{padding:11px 0}
  .task-row{padding:10px 0}
}

/* ═══ RESPONSIVE — SMALL PHONE ══════════════════════ */
@media (max-width:390px){
  .main{padding:calc(12px + env(safe-area-inset-top)) 10px calc(72px + env(safe-area-inset-bottom))}
  .card{padding:13px 12px}
  .hb-grid{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}
  .mn-item{min-width:44px;padding:5px 4px}
  .mn-lbl{font-size:9px}
  .mood-btn{font-size:24px;padding:5px 7px}
}
</style>
</head>
<body data-theme="light">

<aside class="sidebar">
  <div class="sb-head">
    <div class="sb-logo">
      <div class="sb-mark">✦</div>
      <div class="sb-name">个人管理</div>
    </div>
    <div class="sb-sub">Work · Life · Growth</div>
  </div>
  <ul class="nav-list">
    <li class="nav-item"><a onclick="showPage('home')" id="nav-home"><span class="nav-icon">🏠</span>首页总览</a></li>
    <li class="nav-item"><a onclick="showPage('work')" id="nav-work"><span class="nav-icon">💼</span>工作计划</a></li>
    <li class="nav-item"><a onclick="showPage('life')" id="nav-life"><span class="nav-icon">🌿</span>生活计划</a></li>
    <li class="nav-item"><a onclick="showPage('ai')" id="nav-ai"><span class="nav-icon">🤖</span>AI 学习</a></li>
    <li class="nav-item"><a onclick="showPage('settings')" id="nav-settings"><span class="nav-icon">⚙️</span>数据设置</a></li>
  </ul>
  <div class="sb-foot" id="sb-date"></div>
</aside>

<main class="main">
  <div id="page-home" class="page"></div>
  <div id="page-work" class="page"></div>
  <div id="page-life" class="page"></div>
  <div id="page-ai" class="page"></div>
  <div id="page-settings" class="page"></div>
</main>

<div id="mc"></div>
<div id="toast"></div>

<!-- Mobile bottom navigation -->
<nav class="mob-nav">
  <button class="mn-item" id="mnav-home"     onclick="showPage('home')">
    <span class="mn-icon">🏠</span><span class="mn-lbl">首页</span>
  </button>
  <button class="mn-item" id="mnav-work"     onclick="showPage('work')">
    <span class="mn-icon">💼</span><span class="mn-lbl">工作</span>
  </button>
  <button class="mn-item" id="mnav-life"     onclick="showPage('life')">
    <span class="mn-icon">🌿</span><span class="mn-lbl">生活</span>
  </button>
  <button class="mn-item" id="mnav-ai"       onclick="showPage('ai')">
    <span class="mn-icon">🤖</span><span class="mn-lbl">AI</span>
  </button>
  <button class="mn-item" id="mnav-settings" onclick="showPage('settings')">
    <span class="mn-icon">⚙️</span><span class="mn-lbl">设置</span>
  </button>
</nav>

<script>
// ================================================================
// CONSTANTS & STATE
// ================================================================
const SK = 'myapp_data';
let D = {};
let curPage = 'home';
let wDate = '', lDate = '';
let aiTopic = null, aiTab = 'notes';
let _ast = null, _ic = 0;

// ================================================================
// DATA
// ================================================================
function defData() {
  return {
    version: 1,
    settings: {
      theme: 'light',
      habits: [
        { id: 'h1', name: '喝水 8 杯', icon: '💧' },
        { id: 'h2', name: '运动 30 分钟', icon: '🏃' },
        { id: 'h3', name: '阅读', icon: '📚' }
      ]
    },
    memo: { content: '' },
    daily: {},
    aiLearning: { topics: [], notes: [], resources: [] }
  };
}

function defDay() {
  return {
    workPlan: {
      topThree: [
        { id: gid(), text: '', done: false },
        { id: gid(), text: '', done: false },
        { id: gid(), text: '', done: false }
      ],
      tasks: [],
      notes: ''
    },
    lifePlan: {
      habitChecks: {},
      tasks: [],
      mood: null
    }
  };
}

function loadData() {
  try {
    const r = localStorage.getItem(SK);
    if (r) {
      D = JSON.parse(r);
      const df = defData();
      D.settings = D.settings || df.settings;
      D.settings.habits = D.settings.habits || df.settings.habits;
      D.memo = D.memo || df.memo;
      D.daily = D.daily || {};
      D.aiLearning = D.aiLearning || df.aiLearning;
      D.aiLearning.topics = D.aiLearning.topics || [];
      D.aiLearning.notes = D.aiLearning.notes || [];
      D.aiLearning.resources = D.aiLearning.resources || [];
    } else {
      D = defData();
    }
  } catch(e) { D = defData(); }
}

function save() {
  try { localStorage.setItem(SK, JSON.stringify(D)); }
  catch(e) { toast('保存失败：存储空间已满'); }
}

function autoSave() {
  clearTimeout(_ast);
  _ast = setTimeout(save, 500);
}

// ================================================================
// UTILS
// ================================================================
function gid() {
  return Date.now().toString(36) + (++_ic).toString(36) + Math.random().toString(36).slice(2,5);
}

function today() {
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}

function fmtCN(ds) {
  const [y,m,d] = ds.split('-').map(Number);
  const days = ['日','一','二','三','四','五','六'];
  return `${y}年${m}月${d}日 星期${days[new Date(y,m-1,d).getDay()]}`;
}

function fmtShort(ds) {
  const [,m,d] = ds.split('-').map(Number);
  return `${m}月${d}日`;
}

function greeting() {
  const h = new Date().getHours();
  if (h < 6)  return '夜深了，注意休息 🌙';
  if (h < 12) return '早上好，元气满满 ☀️';
  if (h < 14) return '午安，好好休息 🌤';
  if (h < 18) return '下午好，继续加油 💪';
  if (h < 22) return '晚上好，放松一下 🌆';
  return '夜深了，早点休息 😴';
}

function prevDay(ds) {
  const [y,m,d] = ds.split('-').map(Number);
  const nd = new Date(y,m-1,d-1);
  return nd.getFullYear()+'-'+String(nd.getMonth()+1).padStart(2,'0')+'-'+String(nd.getDate()).padStart(2,'0');
}

function nextDay(ds) {
  const [y,m,d] = ds.split('-').map(Number);
  const nd = new Date(y,m-1,d+1);
  return nd.getFullYear()+'-'+String(nd.getMonth()+1).padStart(2,'0')+'-'+String(nd.getDate()).padStart(2,'0');
}

function getDay(ds) {
  if (!D.daily[ds]) { D.daily[ds] = defDay(); save(); }
  return D.daily[ds];
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let _tid = null;
function toast(msg, ms = 2600) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_tid);
  _tid = setTimeout(() => el.classList.remove('show'), ms);
}

// ================================================================
// NAVIGATION
// ================================================================
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item a').forEach(a => a.classList.remove('active'));
  document.querySelectorAll('.mn-item').forEach(a => a.classList.remove('active'));
  const pg = document.getElementById('page-'+id);
  const nv = document.getElementById('nav-'+id);
  const mn = document.getElementById('mnav-'+id);
  if (pg) pg.classList.add('active');
  if (nv) nv.classList.add('active');
  if (mn) mn.classList.add('active');
  // scroll to top on page change (mobile)
  const main = document.querySelector('.main');
  if (main) main.scrollTop = 0;
  curPage = id;
  if (id === 'home')     renderHome();
  else if (id === 'work')     renderWork(wDate);
  else if (id === 'life')     renderLife(lDate);
  else if (id === 'ai')       renderAI();
  else if (id === 'settings') renderSettings();
}

// ================================================================
// HOME
// ================================================================
function renderHome() {
  const td = today();
  const day = getDay(td);
  const wp = day.workPlan, lp = day.lifePlan;
  const habits = D.settings.habits;

  const t3done = wp.topThree.filter(t => t.done && t.text).length;
  const t3tot  = wp.topThree.filter(t => t.text).length;
  const tdone  = wp.tasks.filter(t => t.done).length;
  const ttot   = wp.tasks.length;
  const wtot   = t3tot + ttot, wdone = t3done + tdone;
  const wpct   = wtot > 0 ? Math.round(wdone/wtot*100) : 0;

  const hdone  = habits.filter(h => lp.habitChecks[h.id]).length;
  const hpct   = habits.length > 0 ? Math.round(hdone/habits.length*100) : 0;

  const latestNote = D.aiLearning.notes.slice().sort((a,b) =>
    (b.updatedAt||b.createdAt) > (a.updatedAt||a.createdAt) ? 1 : -1)[0];

  document.getElementById('page-home').innerHTML = `
    <div class="hg">${greeting()}</div>
    <div class="hd">${fmtCN(td)}</div>
    <div class="home-grid">
      <div class="card memo-card">
        <div class="ch"><div class="ct">📝 快速备忘录</div></div>
        <textarea class="ta" id="memo-ta" placeholder="随手记录想法、提醒…" style="min-height:190px">${esc(D.memo.content)}</textarea>
        <div class="ts mt8" id="memo-st">自动保存</div>
      </div>
      <div class="card sum-card" onclick="showPage('work')">
        <div class="ch">
          <div class="ct">💼 今日工作进度</div>
          <span style="color:var(--text-3);font-size:12px">→ 跳转</span>
        </div>
        <div class="fc"><span class="sum-n" style="color:var(--a)">${wdone}</span><span class="sum-d">/ ${wtot} 项完成</span></div>
        <div class="pbar"><div class="pfill" style="width:${wpct}%"></div></div>
        <div class="ts mt8">Top 3: ${t3done}/${t3tot} &nbsp;·&nbsp; 任务: ${tdone}/${ttot}</div>
      </div>
      <div class="card sum-card" onclick="showPage('life')">
        <div class="ch">
          <div class="ct">🌿 今日习惯打卡</div>
          <span style="color:var(--text-3);font-size:12px">→ 跳转</span>
        </div>
        <div class="fc"><span class="sum-n" style="color:var(--a)">${hdone}</span><span class="sum-d">/ ${habits.length} 个完成</span></div>
        <div class="pbar"><div class="pfill" style="width:${hpct}%"></div></div>
        <div class="ts mt8">${habits.slice(0,5).map(h=>`<span style="opacity:${lp.habitChecks[h.id]?1:.25}">${h.icon}</span>`).join(' ')}${habits.length>5?' …':''}</div>
      </div>
      <div class="card sum-card span2" onclick="showPage('ai')">
        <div class="ch">
          <div class="ct">🤖 AI 学习 · 最新笔记</div>
          <span style="color:var(--text-3);font-size:12px">→ 跳转</span>
        </div>
        ${latestNote ? `
          <div style="font-size:13.5px;font-weight:600;color:var(--text);margin-bottom:5px">${esc(latestNote.title)}</div>
          <div class="ai-prev">${esc(latestNote.content)}</div>
          <div class="ts mt8">${new Date(latestNote.updatedAt||latestNote.createdAt).toLocaleDateString('zh-CN')}</div>
        ` : `<div class="es" style="padding:14px 0"><div class="es-i">📝</div><div class="es-t">还没有笔记，去 AI 学习模块新建吧</div></div>`}
      </div>
    </div>`;

  const ta = document.getElementById('memo-ta');
  ta.addEventListener('input', () => {
    D.memo.content = ta.value;
    const st = document.getElementById('memo-st');
    if (st) st.textContent = '保存中…';
    clearTimeout(_ast);
    _ast = setTimeout(() => {
      save();
      const s = document.getElementById('memo-st');
      if (s) s.textContent = '已自动保存 ✓';
    }, 500);
  });
}

// ================================================================
// WORK PLAN
// ================================================================
function renderWork(ds) {
  wDate = ds;
  const td = today(), day = getDay(ds), wp = day.workPlan, isT = ds === td;

  const t3H = wp.topThree.map((item,i) => `
    <div class="t3-item">
      <div class="t3-n">${i+1}</div>
      <input class="t3-in${item.done?' done':''}" id="t3-${i}"
        placeholder="重要事项 ${i+1}…"
        value="${esc(item.text)}"
        ${!isT?'readonly':''}
        oninput="updT3Txt(${i},this.value)">
      <input type="checkbox" style="width:15px;height:15px;cursor:pointer;accent-color:var(--a);flex-shrink:0"
        ${item.done?'checked':''} ${!item.text?'disabled':''}
        onchange="togT3(${i},this.checked)">
    </div>`).join('');

  const tsH = wp.tasks.length === 0
    ? `<div class="es"><div class="es-i">📋</div><div class="es-t">${isT?'还没有任务，添加一个吧':'这天没有任务记录'}</div></div>`
    : wp.tasks.map(t=>`
      <div class="task-row" id="tr-${t.id}">
        <input type="checkbox" style="width:15px;height:15px;cursor:pointer;accent-color:var(--a);flex-shrink:0"
          ${t.done?'checked':''} onchange="togWT('${t.id}',this.checked)">
        <span class="task-txt${t.done?' done':''}">${esc(t.text)}</span>
        <span class="badge ${t.priority==='高'?'b-hi':t.priority==='中'?'b-md':'b-lo'}">${t.priority}</span>
        <span class="badge ${t.timeSlot==='上午'?'b-am':t.timeSlot==='下午'?'b-pm':'b-ev'}">${t.timeSlot}</span>
        ${isT?`<button class="bti del" onclick="delWT('${t.id}')" title="删除">✕</button>`:''}
      </div>`).join('');

  const addH = isT ? `
    <div class="add-form">
      <input class="inp" id="nt-txt" placeholder="添加任务…" onkeydown="if(event.key==='Enter')addWT()">
      <select class="inp" id="nt-p" style="width:auto">
        <option value="高">高</option><option value="中" selected>中</option><option value="低">低</option>
      </select>
      <select class="inp" id="nt-s" style="width:auto">
        <option value="上午">上午</option><option value="下午" selected>下午</option><option value="晚上">晚上</option>
      </select>
      <button class="btn btn-p btn-sm" onclick="addWT()">添加</button>
    </div>` : '';

  document.getElementById('page-work').innerHTML = `
    <div class="ph">
      <div class="fb">
        <div>
          <div class="ph-row"><div class="ph-bar"></div><div class="ph-title">工作计划</div></div>
          <div class="ph-sub">专注重要的事，高效完成工作</div>
        </div>
        <div class="date-nav">
          <button class="bti" onclick="chgW('prev')" title="上一天">◀</button>
          <span class="dlbl">${ds===td?'今天 · ':''}${fmtShort(ds)}</span>
          <button class="bti" onclick="chgW('next')" title="下一天" ${ds>=td?'disabled':''}>▶</button>
          ${ds!==td?`<button class="btn btn-g btn-sm" onclick="chgW('today')">回到今天</button>`:''}
        </div>
      </div>
    </div>
    <div class="g2">
      <div class="card">
        <div class="ch"><div class="ct" style="color:var(--a)">🎯 今日重点 Top 3</div></div>
        ${t3H}
      </div>
      <div class="card">
        <div class="ch">
          <div class="ct" style="color:var(--a)">📋 任务清单</div>
          <span class="ts">${wp.tasks.filter(t=>t.done).length}/${wp.tasks.length} 完成</span>
        </div>
        ${tsH}${addH}
      </div>
      <div class="card span2">
        <div class="ch"><div class="ct" style="color:var(--a)">📝 工作笔记</div></div>
        <textarea class="ta" id="wn-ta" placeholder="记录今天的工作思考、灵感、遇到的问题…"
          style="min-height:130px" ${!isT?'readonly':''}
          oninput="updWN(this.value)">${esc(wp.notes)}</textarea>
      </div>
      <div class="card span2">
        <div class="ch">
          <div class="ct" style="color:var(--a)">✅ 本周已完成工作</div>
          <span class="ts" id="week-range"></span>
        </div>
        <div id="week-done-list">${renderWeekDone()}</div>
      </div>
    </div>`;
  const wr = document.getElementById('week-range');
  if (wr) {
    const wds = getWeekDates();
    if (wds.length) {
      const [,sm,sd] = wds[0].split('-').map(Number);
      const [,em,ed] = wds[wds.length-1].split('-').map(Number);
      wr.textContent = `${sm}月${sd}日 — ${em}月${ed}日`;
    }
  }
}

function chgW(dir) {
  if (dir==='prev') wDate = prevDay(wDate);
  else if (dir==='next') { const n=nextDay(wDate); if(n<=today()) wDate=n; }
  else wDate = today();
  renderWork(wDate);
}
function updT3Txt(i,v) { getDay(wDate).workPlan.topThree[i].text=v; autoSave(); }
function togT3(i,v) { getDay(wDate).workPlan.topThree[i].done=v; save(); renderWork(wDate); }
function addWT() {
  const t=document.getElementById('nt-txt'), p=document.getElementById('nt-p'), s=document.getElementById('nt-s');
  const txt=t.value.trim(); if(!txt){toast('请输入任务内容');return;}
  getDay(wDate).workPlan.tasks.push({id:gid(),text:txt,priority:p.value,timeSlot:s.value,done:false,createdAt:new Date().toISOString()});
  save(); renderWork(wDate);
}
function togWT(id,v) {
  const t=getDay(wDate).workPlan.tasks.find(x=>x.id===id);
  if(t){t.done=v;save();}
  const el=document.querySelector(`#tr-${id} .task-txt`);
  if(el)el.classList.toggle('done',v);
}
function delWT(id) {
  if(!confirm('删除这个任务？'))return;
  const day=getDay(wDate); day.workPlan.tasks=day.workPlan.tasks.filter(x=>x.id!==id);
  save(); renderWork(wDate);
}
function updWN(v) { getDay(wDate).workPlan.notes=v; autoSave(); }

// ── 本周已完成工作 ──
function getWeekDates() {
  const td = today();
  const [y,m,d] = td.split('-').map(Number);
  const now = new Date(y, m-1, d);
  const dow = now.getDay();
  const monday = new Date(now);
  monday.setDate(now.getDate() - (dow === 0 ? 6 : dow - 1));
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const dt = new Date(monday);
    dt.setDate(monday.getDate() + i);
    const ds = dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
    if (ds <= td) dates.push(ds);
  }
  return dates;
}

function renderWeekDone() {
  const weekDates = getWeekDates();
  const dayNames = ['周日','周一','周二','周三','周四','周五','周六'];
  const td = today();
  let hasAny = false, html = '';

  for (const ds of weekDates) {
    if (!D.daily[ds]) continue;
    const wp = D.daily[ds].workPlan;
    const doneT3 = wp.topThree.filter(t => t.done && t.text);
    const doneTasks = wp.tasks.filter(t => t.done);
    if (!doneT3.length && !doneTasks.length) continue;
    hasAny = true;

    const [,m,d] = ds.split('-').map(Number);
    const dow = new Date(ds).getDay();
    const label = ds === td ? `今天（${dayNames[dow]}）` : `${m}月${d}日 ${dayNames[dow]}`;
    const totalDone = doneT3.length + doneTasks.length;

    html += `<div class="wdc-day">
      <div class="wdc-date">${label} <span style="color:var(--a);font-weight:600">${totalDone} 项</span></div>`;
    doneT3.forEach(t => {
      html += `<div class="wdc-item"><span class="wdc-mark star">⭐</span><span>${esc(t.text)}</span><span class="badge b-am" style="margin-left:auto">Top3</span></div>`;
    });
    doneTasks.forEach(t => {
      html += `<div class="wdc-item"><span class="wdc-mark chk">✓</span><span style="flex:1">${esc(t.text)}</span>
        <span class="badge ${t.priority==='高'?'b-hi':t.priority==='中'?'b-md':'b-lo'}">${t.priority}</span>
        <span class="badge ${t.timeSlot==='上午'?'b-am':t.timeSlot==='下午'?'b-pm':'b-ev'}">${t.timeSlot}</span>
      </div>`;
    });
    html += `</div>`;
  }

  if (!hasAny) {
    html = `<div class="es"><div class="es-i">🎯</div><div class="es-t">本周还没有已完成的工作，加油！</div></div>`;
  }
  return html;
}

function renderLife(ds) {
  lDate = ds;
  const td=today(), day=getDay(ds), lp=day.lifePlan, habits=D.settings.habits, isT=ds===td;

  const hbH = habits.length===0
    ? `<div class="es"><div class="es-i">🌿</div><div class="es-t">去「设置」添加习惯吧</div></div>`
    : `<div class="hb-grid">${habits.map(h=>`
        <div class="hb-card${lp.habitChecks[h.id]?' on':''}" onclick="${isT?`togHb('${h.id}')`:''}" style="${!isT?'cursor:default':''}">
          <div class="hb-icon">${h.icon}</div>
          <div class="hb-name">${esc(h.name)}</div>
          ${lp.habitChecks[h.id]?'<div style="font-size:11px;color:var(--a);font-weight:600">✓ 已完成</div>':''}
        </div>`).join('')}</div>`;

  const ltH = lp.tasks.length===0
    ? `<div class="es"><div class="es-i">📌</div><div class="es-t">${isT?'添加今日生活事项':'这天没有生活事项'}</div></div>`
    : lp.tasks.map(t=>`
      <div class="task-row" id="lt-${t.id}">
        <input type="checkbox" style="width:15px;height:15px;cursor:pointer;accent-color:var(--a);flex-shrink:0"
          ${t.done?'checked':''} onchange="togLT('${t.id}',this.checked)">
        <span class="task-txt${t.done?' done':''}">${esc(t.text)}</span>
        ${isT?`<button class="bti del" onclick="delLT('${t.id}')" title="删除">✕</button>`:''}
      </div>`).join('');

  const addLH = isT ? `
    <div class="ig mt12" style="border-top:1px solid var(--border);padding-top:10px">
      <input class="inp" id="nlt-t" placeholder="添加生活事项…" onkeydown="if(event.key==='Enter')addLT()">
      <button class="btn btn-p btn-sm" onclick="addLT()">添加</button>
    </div>` : '';

  const moods=['😫','😟','😐','😊','😄'];
  const moodLbl=['很差','较差','一般','不错','很棒'];
  const cm=lp.mood;
  const moodH=`
    <div class="mood-row">${moods.map((m,i)=>`
      <button class="mood-btn${cm&&cm.level===i+1?' sel':''}"
        onclick="${isT?`setMood(${i+1})`:''}" title="${moodLbl[i]}" ${!isT?'disabled':''}>${m}</button>`).join('')}
    </div>
    ${cm?`<div class="ts mt8" style="color:var(--a)">当前心情：${moodLbl[cm.level-1]}</div>`:''}
    ${isT?`<textarea class="ta mt8" id="mood-n" placeholder="心情备注…（可选）" style="min-height:58px" oninput="updMoodN(this.value)">${esc(cm?cm.note||'':'')}</textarea>`
      :cm&&cm.note?`<div class="ts mt8">${esc(cm.note)}</div>`:''}`;

  document.getElementById('page-life').innerHTML = `
    <div class="ph">
      <div class="fb">
        <div>
          <div class="ph-row"><div class="ph-bar"></div><div class="ph-title">生活计划</div></div>
          <div class="ph-sub">养成好习惯，记录生活点滴</div>
        </div>
        <div class="date-nav">
          <button class="bti" onclick="chgL('prev')">◀</button>
          <span class="dlbl">${ds===td?'今天 · ':''}${fmtShort(ds)}</span>
          <button class="bti" onclick="chgL('next')" ${ds>=td?'disabled':''}>▶</button>
          ${ds!==td?`<button class="btn btn-g btn-sm" onclick="chgL('today')">回到今天</button>`:''}
        </div>
      </div>
    </div>
    <div class="g2">
      <div class="card span2">
        <div class="ch">
          <div class="ct" style="color:var(--a)">✅ 习惯打卡</div>
          <span class="ts">${habits.filter(h=>lp.habitChecks[h.id]).length}/${habits.length} 完成</span>
        </div>
        ${hbH}
      </div>
      <div class="card">
        <div class="ch">
          <div class="ct" style="color:var(--a)">📌 生活事项</div>
          <span class="ts">${lp.tasks.filter(t=>t.done).length}/${lp.tasks.length}</span>
        </div>
        ${ltH}${addLH}
      </div>
      <div class="card">
        <div class="ch"><div class="ct" style="color:var(--a)">💭 心情记录</div></div>
        ${moodH}
      </div>
    </div>`;
}

function chgL(dir) {
  if(dir==='prev') lDate=prevDay(lDate);
  else if(dir==='next'){const n=nextDay(lDate);if(n<=today())lDate=n;}
  else lDate=today();
  renderLife(lDate);
}
function togHb(id) { const lp=getDay(lDate).lifePlan; lp.habitChecks[id]=!lp.habitChecks[id]; save(); renderLife(lDate); }
function addLT() {
  const el=document.getElementById('nlt-t'); const txt=el.value.trim();
  if(!txt){toast('请输入事项内容');return;}
  getDay(lDate).lifePlan.tasks.push({id:gid(),text:txt,done:false,createdAt:new Date().toISOString()});
  save(); renderLife(lDate);
}
function togLT(id,v) {
  const t=getDay(lDate).lifePlan.tasks.find(x=>x.id===id);
  if(t){t.done=v;save();}
  const el=document.querySelector(`#lt-${id} .task-txt`);
  if(el)el.classList.toggle('done',v);
}
function delLT(id) {
  if(!confirm('删除这个事项？'))return;
  const lp=getDay(lDate).lifePlan; lp.tasks=lp.tasks.filter(x=>x.id!==id);
  save(); renderLife(lDate);
}
function setMood(lv) {
  const lp=getDay(lDate).lifePlan;
  if(!lp.mood) lp.mood={level:lv,note:''};
  else lp.mood.level=lv;
  save(); renderLife(lDate);
}
function updMoodN(v) {
  const lp=getDay(lDate).lifePlan;
  if(!lp.mood) lp.mood={level:3,note:v};
  else lp.mood.note=v;
  autoSave();
}

  return aiTab==='notes' ? notesHTML() : resHTML();

function notesHTML() {

    .sort((a,b)=>(b.updatedAt||b.createdAt)>(a.updatedAt||a.createdAt)?1:-1);

    ? `<div class="es"><div class="es-i">📝</div><div class="es-t">还没有笔记，点击「新建笔记」</div></div>`

function resHTML() {

    .sort((a,b)=>b.createdAt>a.createdAt?1:-1);

function addTopic() {
  const n=document.getElementById('tp-n')?.value.trim();

  const tp={id:gid(),name:n,createdAt:new Date().toISOString()};
  D.aiLearning.topics.push(tp); aiTopic=tp.id; save(); closeModal(); renderAI();
}

function delTopic(id) {
  if(!confirm('删除主题会同时删除该主题下的所有笔记，确定吗？'))return;
  D.aiLearning.topics=D.aiLearning.topics.filter(t=>t.id!==id);
  D.aiLearning.notes=D.aiLearning.notes.filter(n=>n.topicId!==id);
  if(aiTopic===id)aiTopic=null;
  save(); renderAI();

function openNote(nid) {
  const n=nid?D.aiLearning.notes.find(x=>x.id===nid):null;
  modal(`
    <div class="mt">${n?'编辑笔记':'新建笔记'}</div>
    <input type="hidden" id="en-id" value="${nid||''}">

    <div class="fg"><label class="fl">内容</label>

      <button class="btn btn-g" onclick="closeModal()">取消</button>
      <button class="btn btn-p" onclick="saveNote()">保存</button>
    </div>`, 'mb-lg');
  setTimeout(()=>document.getElementById('en-t')?.focus(),50);
}

function saveNote() {
  const id=document.getElementById('en-id')?.value;
  const title=document.getElementById('en-t')?.value.trim();
  const content=document.getElementById('en-c')?.value||'';
  if(!title){toast('请输入标题');return;}
  const now=new Date().toISOString();
  if(id){
    const n=D.aiLearning.notes.find(x=>x.id===id);
    if(n){n.title=title;n.content=content;n.updatedAt=now;}
  } else {
    D.aiLearning.notes.push({id:gid(),topicId:aiTopic,title,content,createdAt:now,updatedAt:now});
  }
  save(); closeModal();
  const b=document.getElementById('ai-body'); if(b)b.innerHTML=aiBodyHTML();
}

function delNote(id) {
  if(!confirm('删除这条笔记？'))return;
  D.aiLearning.notes=D.aiLearning.notes.filter(n=>n.id!==id);
  save(); const b=document.getElementById('ai-body'); if(b)b.innerHTML=aiBodyHTML();
}

function addRes() {

function addHb() {
  const icon=document.getElementById('nh-i')?.value.trim()||'⭐';

  D.settings.habits.push({id:gid(),name,icon});
  save(); renderSettings();
}
function delHb(id) {
  if(!confirm('删除这个习惯？（历史打卡记录不受影响）'))return;
  D.settings.habits=D.settings.habits.filter(h=>h.id!==id);
  save(); renderSettings();
}
function togTheme() {
  const t=document.body.dataset.theme==='dark'?'light':'dark';
  document.body.dataset.theme=t; D.settings.theme=t; save(); renderSettings();
}
function exportD() {
  const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`myapp-backup-${today()}.json`; a.click(); URL.revokeObjectURL(a.href);
  toast('数据已导出 ✓');
}
function importD(input) {
  const f=input.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=e=>{
    try {
      const data=JSON.parse(e.target.result);
      if(!data.version||!data.settings){toast('文件格式不正确');return;}
      if(!confirm('导入将覆盖当前所有数据，确定吗？'))return;
      D=data; save();
      document.body.dataset.theme=D.settings.theme||'light';
      loadColorScheme();
      toast('数据导入成功 ✓'); showPage('home');
    } catch(e){toast('解析失败：文件格式错误');}
    input.value='';
  };
  rd.readAsText(f);
}
function clearD() {
  modal(`
    <div class="mt" style="color:var(--red)">⚠️ 清除所有数据</div>
    <p style="font-size:13px;color:var(--text-2);margin-bottom:14px">此操作不可撤销，所有数据（工作计划、生活记录、AI笔记）将永久删除。</p>
    <div class="fg"><label class="fl">请输入「确认清除」来确认</label>
      <input class="inp" id="clr-in" placeholder="确认清除"></div>
    <div class="mf">
      <button class="btn btn-g" onclick="closeModal()">取消</button>
      <button class="btn btn-d" onclick="doClear()">确认清除</button>
    </div>`);
  setTimeout(()=>document.getElementById('clr-in')?.focus(),50);
}
function doClear() {
  const v=document.getElementById('clr-in')?.value;
  if(v!=='确认清除'){toast('请输入正确的确认文字');return;}
  closeModal(); D=defData(); save();
  document.body.dataset.theme='light'; toast('所有数据已清除'); showPage('home');
}

const COLOR_SCHEMES = ['purple','green','pink'];
function setColorScheme(scheme) {
  if (!COLOR_SCHEMES.includes(scheme)) scheme = 'purple';
  document.body.dataset.color = scheme;
  D.settings.colorScheme = scheme;
  save();
  renderSettings();
}
function loadColorScheme() {
  const scheme = D.settings.colorScheme || 'purple';
  document.body.dataset.color = scheme;
}

// ================================================================
// MODAL
// ================================================================
function modal(html, extraCls='') {
  document.getElementById('mc').innerHTML=`
    <div class="mo" onclick="if(event.target===this)closeModal()">
      <div class="mb ${extraCls}">${html}</div>
    </div>`;
}
function closeModal() { document.getElementById('mc').innerHTML=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal(); });

// ================================================================
// INIT
// ================================================================
function init() {
  loadData();
  const td=today();
  wDate=td; lDate=td;
  document.body.dataset.theme=D.settings.theme||'light';
  loadColorScheme();
  getDay(td);
  const sbd=document.getElementById('sb-date');
  if(sbd) sbd.textContent=fmtCN(td).split(' ')[0];
  showPage('home');
}

init();
</script>
</body>
</html>
